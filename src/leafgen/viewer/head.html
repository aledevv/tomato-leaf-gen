<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tomato-leaf-gen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* layout: full-bleed 3D stage, controls docked in a bottom sheet (phone first) */
:root {
  color-scheme: dark;
  --bg: #0b0d0b; --panel: #151915; --line: #2a312a; --fg: #e7ece4; --muted: #96a090;
  --accent: #a9d46b; --chip: #1f251f;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--sans); overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; }
#stage { flex: 1; min-height: 0; position: relative; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
#hud { position: absolute; top: 10px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
#hud h1 { font-size: 15px; font-weight: 500; margin: 0; letter-spacing: .01em; }
#hud .sub { color: var(--muted); font-size: 12px; }
#hud .scale { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--mono); font-size: 12px; }
#sheet { background: var(--panel); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); width: 74px; flex: none; }
button { font: inherit; font-size: 13px; color: var(--fg); background: var(--chip); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 12px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); color: #142010; border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.slider { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.slider input { flex: 1; min-width: 0; accent-color: var(--accent); }
.slider output { font-family: var(--mono); font-size: 12px; color: var(--muted); width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
[hidden] { display: none !important; }
</style>
