[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tomato-leaf-gen"
version = "0.1.0"
description = "Data-driven generator of 3D tomato leaflets: outline, bending, veins and surface relief"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "diffusers>=0.35",
  "numpy>=2.2",
  "opencv-python-headless>=4.11",
  "pillow>=11.0",
  "scikit-image>=0.25,<0.26",
  "scikit-learn>=1.9.1",
  "scipy>=1.16",
  "timm>=1.0",
  "torch>=2.6",
  "triangle==20250106",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/leafgen"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E731"]  # long docstring lines and small lambdas in the experiment code

[tool.uv]
# the library versions of the experiments, so that evaluate.py reproduces the published numbers
constraint-dependencies = [
  "diffusers==0.40.0",
  "numpy==2.5.2",
  "opencv-python-headless==5.0.0.93",
  "pillow==12.3.0",
  "scikit-image==0.25.2",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "timm==1.0.30",
  "torch==2.11.0",
  "torchvision==0.26.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
